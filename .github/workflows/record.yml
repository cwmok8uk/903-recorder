name: 叱咤903 每日自動錄音

on:
  schedule:
    # 設定 4 個後備鬧鐘 (UTC 時間 01:xx 即香港時間 09:xx)
    - cron: '42 1 * * 1-5'
    - cron: '46 1 * * 1-5'
    - cron: '51 1 * * 1-5'
    - cron: '56 1 * * 1-5'

  workflow_dispatch:
    inputs:
      test_seconds:
        description: '試錄秒數 (測試填 60；正式錄 2 小時填 7260)'
        required: true
        default: '60'

# 加入「防撞車排隊」機制，確保同一時間只有一部雲端機錄緊音
concurrency:
  group: "record-903"
  cancel-in-progress: false

jobs:
  record-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: 1. 載入程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python、Playwright、FFmpeg 及 Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone
          pip install playwright
          playwright install --with-deps chromium

      - name: 3. 執行擷取及錄音
        env:
          RECORD_SECONDS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_seconds || '7260' }}
          WAIT_FOR_10AM: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: python record_903.py

      - name: 4. 自動上傳至 Google Drive 並清理超過 14 日嘅舊檔
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          rclone copy ./recordings gdrive:903_Podcast -v
          rclone delete gdrive:903_Podcast --min-age 14d -v
